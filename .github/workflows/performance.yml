name: performance

on: [pull_request]

jobs:
  compressed-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: preactjs/compressed-size-action@v2
        env:
          MINIFY: 'true'
        with:
          # TODO: remove this and the clean:node-modules script after merge.
          # The base branch still uses nodeLinker: hoisted, which breaks pnpm bin links.
          clean-script: 'clean:node-modules'
          omit-unchanged: 'true'
          exclude: './packages/react-native-web/dist/cjs/{index.js,**/*.js}'
          pattern: './packages/react-native-web/dist/{index.js,**/*.js}'
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
